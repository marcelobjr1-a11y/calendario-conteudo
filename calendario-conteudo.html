<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendario de Conteudo - Redes Sociais</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f172a;
    --surface: #1e293b;
    --surface-2: #334155;
    --border: #475569;
    --text: #f1f5f9;
    --text-muted: #94a3b8;
    --accent: #6366f1;
    --accent-hover: #818cf8;
    --success: #10b981;
    --warning: #f59e0b;
    --info: #3b82f6;
    --danger: #ef4444;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    color: var(--text);
    min-height: 100vh;
    padding: 24px;
    line-height: 1.5;
  }

  .container { max-width: 1400px; margin: 0 auto; }

  header {
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
  }

  .title { display: flex; align-items: center; gap: 12px; }
  .title h1 { font-size: 22px; font-weight: 700; }

  .title-icon {
    width: 40px; height: 40px;
    background: var(--accent);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }

  .header-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  button {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    transition: all 0.15s ease;
    font-weight: 500;
  }

  button:hover { background: var(--surface-2); border-color: var(--accent); }

  button.primary { background: var(--accent); border-color: var(--accent); }
  button.primary:hover { background: var(--accent-hover); }

  button.danger { background: transparent; border-color: var(--danger); color: var(--danger); }
  button.danger:hover { background: var(--danger); color: white; }

  /* PROFILE BAR */
  .profile-bar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .profile-tabs {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    flex: 1;
  }

  .profile-tab {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface-2);
    border: 2px solid transparent;
    border-radius: 999px;
    padding: 6px 14px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    transition: all 0.15s ease;
    color: var(--text);
  }

  .profile-tab:hover { background: var(--border); }

  .profile-tab.active {
    background: rgba(99, 102, 241, 0.15);
    border-color: var(--accent);
  }

  .profile-tab .profile-color {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .profile-tab .post-counter {
    background: rgba(255,255,255,0.1);
    padding: 1px 8px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 700;
  }

  .profile-tab.active .post-counter {
    background: var(--accent);
    color: white;
  }

  .profile-tab .edit-icon {
    opacity: 0;
    font-size: 12px;
    margin-left: 4px;
    transition: opacity 0.15s;
  }
  .profile-tab.active .edit-icon { opacity: 0.7; }
  .profile-tab.active .edit-icon:hover { opacity: 1; }

  .add-profile-btn {
    border: 2px dashed var(--border);
    background: transparent;
    color: var(--text-muted);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 13px;
    font-weight: 600;
  }
  .add-profile-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(99,102,241,0.05);
  }

  .nav-bar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }

  .month-nav { display: flex; align-items: center; gap: 12px; }

  .month-display {
    font-size: 20px;
    font-weight: 600;
    min-width: 220px;
    text-align: center;
    text-transform: capitalize;
  }

  .nav-btn {
    width: 36px; height: 36px;
    padding: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }

  select {
    background: var(--surface-2);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 8px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
  }

  .calendar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 24px;
  }

  .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); background: var(--surface-2); }

  .weekday {
    padding: 12px;
    text-align: center;
    font-weight: 600;
    font-size: 13px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background: var(--border); }

  .day {
    background: var(--surface);
    min-height: 110px;
    padding: 8px;
    cursor: pointer;
    transition: background 0.15s ease;
    position: relative;
    display: flex;
    flex-direction: column;
  }
  .day:hover { background: var(--surface-2); }
  .day.empty { cursor: default; background: rgba(15, 23, 42, 0.4); }

  .day.today .day-number {
    background: var(--accent);
    color: white;
    width: 28px; height: 28px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700;
  }

  .day.selected { outline: 2px solid var(--accent); outline-offset: -2px; }

  .day-number { font-size: 14px; font-weight: 600; margin-bottom: 4px; }

  .day-content { display: flex; flex-direction: column; gap: 3px; overflow: hidden; flex: 1; }

  .post-pill {
    font-size: 11px;
    padding: 3px 6px;
    border-radius: 4px;
    color: white;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .post-count {
    position: absolute;
    top: 6px; right: 6px;
    background: var(--accent);
    color: white;
    font-size: 10px;
    font-weight: 700;
    width: 18px; height: 18px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }

  .editor {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
  }

  .editor-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 12px;
  }

  .editor-title { font-size: 18px; font-weight: 600; }

  .editor-empty {
    text-align: center;
    padding: 48px 24px;
    color: var(--text-muted);
  }

  .editor-empty-icon { font-size: 48px; margin-bottom: 12px; }

  .posts-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }

  .post-card {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
  }

  .post-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    gap: 8px;
    flex-wrap: wrap;
  }

  .platform-badge {
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 20px;
    color: white;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .status-badge {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }

  .status-ideia { background: rgba(148, 163, 184, 0.2); color: #cbd5e1; }
  .status-rascunho { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
  .status-aprovado { background: rgba(59, 130, 246, 0.2); color: #60a5fa; }
  .status-agendado { background: rgba(168, 85, 247, 0.2); color: #c084fc; }
  .status-publicado { background: rgba(16, 185, 129, 0.2); color: #34d399; }

  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  .form-row { display: flex; flex-direction: column; gap: 6px; }
  .form-row.full { grid-column: 1 / -1; }

  label {
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  input, textarea, .form-row select {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    width: 100%;
    transition: border-color 0.15s ease;
  }

  input:focus, textarea:focus, .form-row select:focus { outline: none; border-color: var(--accent); }

  textarea { resize: vertical; min-height: 80px; }

  .post-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }

  .add-post-btn {
    width: 100%;
    padding: 12px;
    background: transparent;
    border: 2px dashed var(--border);
    color: var(--text-muted);
    font-weight: 600;
  }
  .add-post-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(99, 102, 241, 0.05);
  }

  .stats-bar {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    margin-bottom: 16px;
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .stat-icon {
    font-size: 22px;
    width: 40px; height: 40px;
    background: var(--surface-2);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
  }

  .stat-info { flex: 1; }
  .stat-value { font-size: 20px; font-weight: 700; }
  .stat-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }

  /* MODAL */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 16px;
  }
  .modal-overlay.show { display: flex; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    width: 100%;
    max-width: 480px;
    max-height: 90vh;
    overflow-y: auto;
  }

  .modal h2 {
    font-size: 18px;
    margin-bottom: 16px;
  }

  .color-picker {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 4px;
  }

  .color-swatch {
    width: 32px; height: 32px;
    border-radius: 50%;
    cursor: pointer;
    border: 3px solid transparent;
    transition: transform 0.15s;
  }
  .color-swatch:hover { transform: scale(1.1); }
  .color-swatch.selected { border-color: white; }

  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 20px;
  }

  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--surface);
    border: 1px solid var(--success);
    color: var(--text);
    padding: 12px 20px;
    border-radius: 8px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    transform: translateY(100px);
    opacity: 0;
    transition: all 0.3s ease;
    z-index: 1000;
  }
  .toast.show { transform: translateY(0); opacity: 1; }

  @media (max-width: 768px) {
    body { padding: 12px; }
    .day { min-height: 80px; padding: 4px; }
    .day-number { font-size: 12px; }
    .post-pill { font-size: 9px; padding: 2px 4px; }
    .form-grid { grid-template-columns: 1fr; }
    .month-display { font-size: 16px; min-width: 160px; }
    .weekday { padding: 8px 4px; font-size: 11px; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="title">
      <div class="title-icon">📅</div>
      <h1>Calendario de Conteudo</h1>
    </div>
    <div class="header-actions">
      <button onclick="exportData()">⬇️ Exportar</button>
      <button onclick="document.getElementById('importFile').click()">⬆️ Importar</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
    </div>
  </header>

  <div class="profile-bar">
    <div class="profile-tabs" id="profileTabs"></div>
    <button class="add-profile-btn" onclick="openProfileModal()">+ Novo Perfil</button>
  </div>

  <div class="stats-bar" id="statsBar"></div>

  <div class="nav-bar">
    <div class="month-nav">
      <button class="nav-btn" onclick="changeMonth(-1)">‹</button>
      <div class="month-display" id="monthDisplay"></div>
      <button class="nav-btn" onclick="changeMonth(1)">›</button>
    </div>
    <div style="display: flex; gap: 8px; align-items: center;">
      <select id="yearSelect" onchange="changeYear(this.value)"></select>
      <button onclick="goToToday()">Hoje</button>
    </div>
  </div>

  <div class="calendar">
    <div class="weekdays">
      <div class="weekday">Dom</div>
      <div class="weekday">Seg</div>
      <div class="weekday">Ter</div>
      <div class="weekday">Qua</div>
      <div class="weekday">Qui</div>
      <div class="weekday">Sex</div>
      <div class="weekday">Sab</div>
    </div>
    <div class="days" id="daysGrid"></div>
  </div>

  <div class="editor" id="editor">
    <div class="editor-empty">
      <div class="editor-empty-icon">📝</div>
      <p>Selecione uma data no calendario para gerenciar o conteudo</p>
    </div>
  </div>
</div>

<!-- Profile Modal -->
<div class="modal-overlay" id="profileModal">
  <div class="modal">
    <h2 id="modalTitle">Novo Perfil</h2>
    <div class="form-row" style="margin-bottom: 12px;">
      <label>Nome do perfil / conta</label>
      <input type="text" id="profileNameInput" placeholder="Ex.: @minhamarca, Cliente X, Marca Pessoal">
    </div>
    <div class="form-row">
      <label>Cor de identificacao</label>
      <div class="color-picker" id="colorPicker"></div>
    </div>
    <div class="modal-actions">
      <button class="danger" id="deleteProfileBtn" onclick="deleteCurrentProfile()" style="display:none; margin-right: auto;">Excluir Perfil</button>
      <button onclick="closeProfileModal()">Cancelar</button>
      <button class="primary" onclick="saveProfile()">Salvar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const STORAGE_KEY = 'calendario_conteudo_v2';
  const PLATFORMS = {
    instagram: { name: 'Instagram', color: '#E4405F', icon: '📷' },
    linkedin:  { name: 'LinkedIn',  color: '#0A66C2', icon: '💼' },
    twitter:   { name: 'Twitter/X', color: '#1DA1F2', icon: '🐦' },
    tiktok:    { name: 'TikTok',    color: '#000000', icon: '🎵' },
    facebook:  { name: 'Facebook',  color: '#1877F2', icon: '👥' },
    youtube:   { name: 'YouTube',   color: '#FF0000', icon: '▶️' },
    threads:   { name: 'Threads',   color: '#000000', icon: '@' },
    pinterest: { name: 'Pinterest', color: '#BD081C', icon: '📌' }
  };

  const POST_TYPES = ['Post', 'Carrossel', 'Reels', 'Stories', 'Video', 'Live', 'Artigo', 'Thread'];
  const STATUSES = [
    { value: 'ideia',     label: 'Ideia' },
    { value: 'rascunho',  label: 'Rascunho' },
    { value: 'aprovado',  label: 'Aprovado' },
    { value: 'agendado',  label: 'Agendado' },
    { value: 'publicado', label: 'Publicado' }
  ];

  const MONTHS = ['Janeiro','Fevereiro','Marco','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

  const PROFILE_COLORS = ['#6366f1','#10b981','#f59e0b','#ef4444','#3b82f6','#a855f7','#ec4899','#14b8a6','#f97316','#84cc16'];

  let store = loadStore();
  let currentYear = new Date().getFullYear();
  let currentMonth = new Date().getMonth();
  let selectedDate = null;
  let editingProfileId = null;
  let modalSelectedColor = PROFILE_COLORS[0];

  function loadStore() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch {}

    // Migration from v1
    try {
      const oldRaw = localStorage.getItem('calendario_conteudo_v1');
      if (oldRaw) {
        const oldData = JSON.parse(oldRaw);
        const id = 'p_' + Date.now();
        return {
          activeProfile: id,
          profiles: { [id]: { id, name: 'Perfil Principal', color: PROFILE_COLORS[0], data: oldData } }
        };
      }
    } catch {}

    // Fresh start with default profile
    const id = 'p_' + Date.now();
    return {
      activeProfile: id,
      profiles: { [id]: { id, name: 'Perfil Principal', color: PROFILE_COLORS[0], data: {} } }
    };
  }

  function saveStore() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(store));
  }

  function activeProfile() {
    return store.profiles[store.activeProfile];
  }

  function activeData() {
    return activeProfile().data;
  }

  function dateKey(year, month, day) {
    return `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
  }

  function getPosts(key) {
    return activeData()[key] || [];
  }

  function setPosts(key, posts) {
    const data = activeData();
    if (posts.length === 0) delete data[key];
    else data[key] = posts;
    saveStore();
  }

  function countProfilePosts(profileId) {
    const data = store.profiles[profileId].data;
    let total = 0;
    for (const k in data) total += data[k].length;
    return total;
  }

  // PROFILES UI
  function renderProfiles() {
    const tabs = document.getElementById('profileTabs');
    tabs.innerHTML = '';
    for (const id in store.profiles) {
      const p = store.profiles[id];
      const isActive = id === store.activeProfile;
      const tab = document.createElement('div');
      tab.className = 'profile-tab' + (isActive ? ' active' : '');
      tab.onclick = (e) => {
        if (e.target.classList.contains('edit-icon')) return;
        switchProfile(id);
      };
      tab.innerHTML = `
        <span class="profile-color" style="background:${p.color}"></span>
        <span>${escapeHtml(p.name)}</span>
        <span class="post-counter">${countProfilePosts(id)}</span>
        ${isActive ? `<span class="edit-icon" onclick="event.stopPropagation(); openProfileModal('${id}')" title="Editar perfil">✎</span>` : ''}
      `;
      tabs.appendChild(tab);
    }
  }

  function switchProfile(id) {
    store.activeProfile = id;
    selectedDate = null;
    saveStore();
    render();
    showToast('Perfil: ' + store.profiles[id].name);
  }

  function openProfileModal(id) {
    editingProfileId = id || null;
    const modal = document.getElementById('profileModal');
    const title = document.getElementById('modalTitle');
    const nameInput = document.getElementById('profileNameInput');
    const deleteBtn = document.getElementById('deleteProfileBtn');

    if (id) {
      const p = store.profiles[id];
      title.textContent = 'Editar Perfil';
      nameInput.value = p.name;
      modalSelectedColor = p.color;
      deleteBtn.style.display = Object.keys(store.profiles).length > 1 ? 'block' : 'none';
    } else {
      title.textContent = 'Novo Perfil';
      nameInput.value = '';
      modalSelectedColor = PROFILE_COLORS[Object.keys(store.profiles).length % PROFILE_COLORS.length];
      deleteBtn.style.display = 'none';
    }

    renderColorPicker();
    modal.classList.add('show');
    setTimeout(() => nameInput.focus(), 50);
  }

  function renderColorPicker() {
    const picker = document.getElementById('colorPicker');
    picker.innerHTML = '';
    PROFILE_COLORS.forEach(c => {
      const sw = document.createElement('div');
      sw.className = 'color-swatch' + (c === modalSelectedColor ? ' selected' : '');
      sw.style.background = c;
      sw.onclick = () => { modalSelectedColor = c; renderColorPicker(); };
      picker.appendChild(sw);
    });
  }

  function closeProfileModal() {
    document.getElementById('profileModal').classList.remove('show');
    editingProfileId = null;
  }

  function saveProfile() {
    const name = document.getElementById('profileNameInput').value.trim();
    if (!name) { alert('Digite um nome para o perfil'); return; }

    if (editingProfileId) {
      store.profiles[editingProfileId].name = name;
      store.profiles[editingProfileId].color = modalSelectedColor;
      showToast('Perfil atualizado');
    } else {
      const id = 'p_' + Date.now();
      store.profiles[id] = { id, name, color: modalSelectedColor, data: {} };
      store.activeProfile = id;
      selectedDate = null;
      showToast('Novo perfil criado');
    }

    saveStore();
    closeProfileModal();
    render();
  }

  function deleteCurrentProfile() {
    if (!editingProfileId) return;
    if (Object.keys(store.profiles).length <= 1) {
      alert('Voce precisa ter pelo menos um perfil');
      return;
    }
    const p = store.profiles[editingProfileId];
    const postCount = countProfilePosts(editingProfileId);
    const msg = postCount > 0
      ? `Excluir o perfil "${p.name}" e seus ${postCount} conteudos? Esta acao nao pode ser desfeita.`
      : `Excluir o perfil "${p.name}"?`;
    if (!confirm(msg)) return;

    delete store.profiles[editingProfileId];
    if (store.activeProfile === editingProfileId) {
      store.activeProfile = Object.keys(store.profiles)[0];
      selectedDate = null;
    }
    saveStore();
    closeProfileModal();
    render();
    showToast('Perfil excluido');
  }

  // CALENDAR
  function buildYearSelect() {
    const sel = document.getElementById('yearSelect');
    sel.innerHTML = '';
    for (let y = 2024; y <= 2030; y++) {
      const opt = document.createElement('option');
      opt.value = y;
      opt.textContent = y;
      if (y === currentYear) opt.selected = true;
      sel.appendChild(opt);
    }
  }

  function changeMonth(delta) {
    currentMonth += delta;
    if (currentMonth > 11) { currentMonth = 0; currentYear++; }
    if (currentMonth < 0)  { currentMonth = 11; currentYear--; }
    document.getElementById('yearSelect').value = currentYear;
    render();
  }

  function changeYear(year) { currentYear = parseInt(year); render(); }

  function goToToday() {
    const today = new Date();
    currentYear = today.getFullYear();
    currentMonth = today.getMonth();
    selectedDate = dateKey(currentYear, currentMonth, today.getDate());
    document.getElementById('yearSelect').value = currentYear;
    render();
  }

  function render() {
    document.getElementById('monthDisplay').textContent = `${MONTHS[currentMonth]} ${currentYear}`;
    renderProfiles();
    renderCalendar();
    renderEditor();
    renderStats();
  }

  function renderCalendar() {
    const grid = document.getElementById('daysGrid');
    grid.innerHTML = '';
    const firstDay = new Date(currentYear, currentMonth, 1).getDay();
    const daysInMonth = new Date(currentYear, currentMonth+1, 0).getDate();
    const today = new Date();
    const todayKey = dateKey(today.getFullYear(), today.getMonth(), today.getDate());

    for (let i = 0; i < firstDay; i++) {
      const empty = document.createElement('div');
      empty.className = 'day empty';
      grid.appendChild(empty);
    }

    for (let d = 1; d <= daysInMonth; d++) {
      const key = dateKey(currentYear, currentMonth, d);
      const posts = getPosts(key);
      const div = document.createElement('div');
      div.className = 'day';
      if (key === todayKey) div.classList.add('today');
      if (key === selectedDate) div.classList.add('selected');
      div.onclick = () => { selectedDate = key; render(); };

      const num = document.createElement('div');
      num.className = 'day-number';
      num.textContent = d;
      div.appendChild(num);

      const content = document.createElement('div');
      content.className = 'day-content';
      const visible = posts.slice(0, 3);
      for (const p of visible) {
        const pill = document.createElement('div');
        pill.className = 'post-pill';
        pill.style.background = (PLATFORMS[p.platform] || {}).color || '#64748b';
        pill.title = `${(PLATFORMS[p.platform] || {}).name || ''} - ${p.title || 'Sem titulo'}`;
        pill.innerHTML = `<span>${(PLATFORMS[p.platform] || {}).icon || '•'}</span><span>${escapeHtml(p.title || 'Sem titulo')}</span>`;
        content.appendChild(pill);
      }
      if (posts.length > 3) {
        const more = document.createElement('div');
        more.className = 'post-pill';
        more.style.background = 'var(--surface-2)';
        more.textContent = `+${posts.length - 3}`;
        content.appendChild(more);
      }
      div.appendChild(content);

      if (posts.length > 0) {
        const badge = document.createElement('div');
        badge.className = 'post-count';
        badge.style.background = activeProfile().color;
        badge.textContent = posts.length;
        div.appendChild(badge);
      }

      grid.appendChild(div);
    }
  }

  function renderEditor() {
    const editor = document.getElementById('editor');
    if (!selectedDate) {
      editor.innerHTML = `<div class="editor-empty"><div class="editor-empty-icon">📝</div><p>Selecione uma data no calendario para gerenciar o conteudo</p></div>`;
      return;
    }

    const [y, m, d] = selectedDate.split('-').map(Number);
    const dateObj = new Date(y, m-1, d);
    const dateLabel = dateObj.toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' });
    const posts = getPosts(selectedDate);
    const profile = activeProfile();

    let html = `
      <div class="editor-header">
        <div>
          <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 4px;">
            <span style="width:8px; height:8px; border-radius:50%; background:${profile.color}"></span>
            <span style="font-size: 12px; color: var(--text-muted); font-weight: 600;">${escapeHtml(profile.name)}</span>
          </div>
          <div class="editor-title" style="text-transform: capitalize;">${dateLabel}</div>
          <div style="color: var(--text-muted); font-size: 13px; margin-top: 2px;">${posts.length} ${posts.length === 1 ? 'conteudo' : 'conteudos'} planejado(s)</div>
        </div>
      </div>
      <div class="posts-list">
    `;

    posts.forEach((p, idx) => {
      const platformInfo = PLATFORMS[p.platform] || PLATFORMS.instagram;
      html += `
        <div class="post-card">
          <div class="post-card-header">
            <span class="platform-badge" style="background: ${platformInfo.color}">
              <span>${platformInfo.icon}</span>${platformInfo.name}
            </span>
            <span class="status-badge status-${p.status || 'ideia'}">${(STATUSES.find(s=>s.value===p.status) || STATUSES[0]).label}</span>
          </div>
          <div class="form-grid">
            <div class="form-row">
              <label>Plataforma</label>
              <select onchange="updatePost('${selectedDate}', ${idx}, 'platform', this.value)">
                ${Object.entries(PLATFORMS).map(([k,v]) => `<option value="${k}" ${p.platform===k?'selected':''}>${v.icon} ${v.name}</option>`).join('')}
              </select>
            </div>
            <div class="form-row">
              <label>Tipo de Post</label>
              <select onchange="updatePost('${selectedDate}', ${idx}, 'type', this.value)">
                ${POST_TYPES.map(t => `<option value="${t}" ${p.type===t?'selected':''}>${t}</option>`).join('')}
              </select>
            </div>
            <div class="form-row">
              <label>Status</label>
              <select onchange="updatePost('${selectedDate}', ${idx}, 'status', this.value)">
                ${STATUSES.map(s => `<option value="${s.value}" ${p.status===s.value?'selected':''}>${s.label}</option>`).join('')}
              </select>
            </div>
            <div class="form-row">
              <label>Horario</label>
              <input type="time" value="${p.time || ''}" oninput="updatePost('${selectedDate}', ${idx}, 'time', this.value)">
            </div>
            <div class="form-row full">
              <label>Titulo / Tema</label>
              <input type="text" value="${escapeAttr(p.title || '')}" placeholder="Ex.: 5 dicas de marketing digital" oninput="updatePost('${selectedDate}', ${idx}, 'title', this.value)">
            </div>
            <div class="form-row full">
              <label>Legenda / Conteudo</label>
              <textarea placeholder="Texto do post, copy, descricao..." oninput="updatePost('${selectedDate}', ${idx}, 'caption', this.value)">${escapeHtml(p.caption || '')}</textarea>
            </div>
            <div class="form-row full">
              <label>Hashtags</label>
              <input type="text" value="${escapeAttr(p.hashtags || '')}" placeholder="#marketing #conteudo #social" oninput="updatePost('${selectedDate}', ${idx}, 'hashtags', this.value)">
            </div>
            <div class="form-row full">
              <label>Notas / Brief</label>
              <textarea placeholder="Observacoes, referencias, links..." oninput="updatePost('${selectedDate}', ${idx}, 'notes', this.value)">${escapeHtml(p.notes || '')}</textarea>
            </div>
          </div>
          <div class="post-actions">
            <button class="danger" onclick="deletePost('${selectedDate}', ${idx})">Excluir</button>
            <button onclick="duplicatePost('${selectedDate}', ${idx})">Duplicar</button>
          </div>
        </div>
      `;
    });

    html += `</div>
      <button class="add-post-btn" onclick="addPost('${selectedDate}')">+ Adicionar novo conteudo</button>
    `;

    editor.innerHTML = html;
  }

  function renderStats() {
    const monthPrefix = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}`;
    const data = activeData();
    let total = 0, agendado = 0, publicado = 0, rascunho = 0;
    const platformCount = {};
    for (const key in data) {
      if (!key.startsWith(monthPrefix)) continue;
      for (const p of data[key]) {
        total++;
        if (p.status === 'agendado') agendado++;
        if (p.status === 'publicado') publicado++;
        if (p.status === 'rascunho' || p.status === 'ideia' || !p.status) rascunho++;
        platformCount[p.platform] = (platformCount[p.platform] || 0) + 1;
      }
    }
    const topPlatform = Object.entries(platformCount).sort((a,b)=>b[1]-a[1])[0];
    const topName = topPlatform ? PLATFORMS[topPlatform[0]].name : '-';

    document.getElementById('statsBar').innerHTML = `
      <div class="stat-card"><div class="stat-icon">📊</div><div class="stat-info"><div class="stat-value">${total}</div><div class="stat-label">Total no mes</div></div></div>
      <div class="stat-card"><div class="stat-icon">📝</div><div class="stat-info"><div class="stat-value">${rascunho}</div><div class="stat-label">Em ideia/rascunho</div></div></div>
      <div class="stat-card"><div class="stat-icon">⏰</div><div class="stat-info"><div class="stat-value">${agendado}</div><div class="stat-label">Agendados</div></div></div>
      <div class="stat-card"><div class="stat-icon">✅</div><div class="stat-info"><div class="stat-value">${publicado}</div><div class="stat-label">Publicados</div></div></div>
      <div class="stat-card"><div class="stat-icon">⭐</div><div class="stat-info"><div class="stat-value" style="font-size:14px">${topName}</div><div class="stat-label">Plataforma top</div></div></div>
    `;
  }

  function addPost(key) {
    const posts = getPosts(key);
    posts.push({
      platform: 'instagram',
      type: 'Post',
      status: 'ideia',
      title: '', caption: '', hashtags: '', notes: '', time: ''
    });
    setPosts(key, posts);
    render();
  }

  function updatePost(key, idx, field, value) {
    const posts = getPosts(key);
    if (posts[idx]) {
      posts[idx][field] = value;
      setPosts(key, posts);
      renderProfiles();
      renderCalendar();
      renderStats();
    }
  }

  function deletePost(key, idx) {
    if (!confirm('Excluir este conteudo?')) return;
    const posts = getPosts(key);
    posts.splice(idx, 1);
    setPosts(key, posts);
    render();
    showToast('Conteudo excluido');
  }

  function duplicatePost(key, idx) {
    const posts = getPosts(key);
    if (posts[idx]) {
      posts.push(JSON.parse(JSON.stringify(posts[idx])));
      setPosts(key, posts);
      render();
      showToast('Conteudo duplicado');
    }
  }

  function exportData() {
    const blob = new Blob([JSON.stringify(store, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `calendario-conteudo-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
    showToast('Backup exportado');
  }

  function importData(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = JSON.parse(e.target.result);
        if (!confirm('Substituir todos os dados atuais pelo arquivo importado?')) return;

        // Detect old format (v1) and migrate
        if (data.profiles && data.activeProfile) {
          store = data;
        } else {
          // Old v1 format - convert to single profile
          const id = 'p_' + Date.now();
          store = {
            activeProfile: id,
            profiles: { [id]: { id, name: 'Importado', color: PROFILE_COLORS[0], data: data } }
          };
        }
        saveStore();
        selectedDate = null;
        render();
        showToast('Dados importados com sucesso');
      } catch (err) {
        alert('Arquivo invalido: ' + err.message);
      }
    };
    reader.readAsText(file);
    event.target.value = '';
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function escapeAttr(s) { return escapeHtml(s); }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  }

  // Close modal on overlay click
  document.getElementById('profileModal').addEventListener('click', (e) => {
    if (e.target.id === 'profileModal') closeProfileModal();
  });

  // Close modal on Escape
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeProfileModal();
  });

  buildYearSelect();
  render();
</script>
</body>
</html>
